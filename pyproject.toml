[project]
name = "llm_sas"
dynamic = ['version']
description = "Presentation to de-mystify LLMs"
authors = [{name = "Becky Sweger"}]
maintainers = [{name = "Becky Sweger"}]
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "structlog",
    "torch>=2.12.0",
    "transformers>=5.9.0",
    "urllib3>=2.7.0",
    "streamlit>=1.58.0",
    "marimo>=0.23.9",
    "polars>=1.41.2",
    "plotly>=6.7.0",
]

[dependency-groups]
dev = [
    "coverage",
    "huggingface-hub>=1.17.0",
    "pre-commit",
    "pytest",
    "pytest-random-order>=1.1.1",
    "rich>=15.0.0",
    "ruff",
    "ty>=0.0.40",
    "websockets>=16.0",
]

[project.scripts]
llmdemo = "llm_sas.app:main"

[project.urls]

[build-system]
requires = ["setuptools>=82.0.1", "wheel", "setuptools_scm>=10.0.5"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = "--random-order"
testpaths = [
    "test",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",  # isort
    "Q",  # flake8-quotes
    "S",  # flake8-bandit security rules
]

[tool.ruff.lint.extend-per-file-ignores]
"test/**/*.py" = [
    # at least this three should be fine in tests:
    "S101",  # allow assert in tests
    "S603",  # subprocess commands in test suite not subject to untrusted input
    "S607",  # allow subprocess python-based commands in tests
]

[tool.uv]
exclude-newer = "5 days"

# Use the CPU-only torch build on Linux (Streamlit Community Cloud) to avoid
# pulling the multi-GB CUDA stack. macOS keeps the default PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
