[project]
name = "llm_sas"
dynamic = ['version']
description = "Presentation to de-mystify LLMs"
authors = [{name = "Becky Sweger"}]
maintainers = [{name = "Becky Sweger"}]
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "marimo>=0.23.4",
    "pydantic-ai>=1.89.1",
    "rich",
    "structlog",
    "torch>=2.11.0",
    "transformers>=5.7.0",
    "torch>=2.11.0",
    "transformers>=5.7.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "altair>=6.1.0",
    "coverage",
    "nbformat>=5.10.4",
    "pre-commit",
    "pytest",
    "pytest-random-order>=1.1.1",
    "python-lsp-ruff>=2.3.1",
    "python-lsp-server>=1.14.0",
    "ruff",
    "ty>=0.0.34",
    "websockets>=16.0",
]

[project.scripts]
llm_sas = "llm_sas.app:main"

[project.urls]

[build-system]
requires = ["setuptools>=82.0.1", "wheel", "setuptools_scm>=10.0.5"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = "--random-order"
testpaths = [
    "test",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",  # isort
    "Q",  # flake8-quotes
    "S",  # flake8-bandit security rules
]

[tool.ruff.lint.extend-per-file-ignores]
"test/**/*.py" = [
    # at least this three should be fine in tests:
    "S101",  # allow assert in tests
    "S603",  # subprocess commands in test suite not subject to untrusted input
    "S607",  # allow subprocess python-based commands in tests
]

[tool.uv]
exclude-newer = "5 days"

[tool.marimo.ai.models]
chat_model = "ollama/qwen3.6:27b"
edit_model = "ollama/qwen3.6:27b"
autocomplete_model = "ollama/qwen3.6:27b"

[tool.marimo.ai.ollama]
base_url = "http://localhost:11434/v1/"

[tool.marimo.language_servers.ty]
enabled = true
